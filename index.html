<style>
/* VOICE: a shop-floor instrument — calm, exact, big touch targets, no decoration that is not information

   COLOUR and TYPE: aluminum ground, graphite ink, Dykem blue #2457d6, safety orange #ff6a13 for run/G-code; Barlow
   LAYOUT: top bar + content; bottom tab bar on phones, side rail on wide screens */
:root{color-scheme:light dark;
--bg:light-dark(#eef0f1,#0f1215);--panel:light-dark(#ffffff,#181c20);--panel2:light-dark(#f6f7f8,#1f2429);
--ink:light-dark(#14181c,#e9edf0);--mut:light-dark(#5b646c,#97a1aa);--line:light-dark(#d9dde1,#2b3137);
--blue:#2457d6;--blue2:light-dark(#e3eafc,#17264d);--org:#ff6a13;--org2:light-dark(#fff0e6,#3a1f0e);--ok:#1c9b5f;--bad:#d93a3a;
--r:14px;--sh:0 1px 2px rgb(0 0 0/.06),0 6px 20px rgb(0 0 0/.06)}

*{box-sizing:border-box;min-width:0}
html,body{height:100%;max-width:100vw;overflow-x:hidden;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}input,select,textarea{font-size:max(16px,1em)}

button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;min-height:100dvh}
header.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand . lang" "ctx ctx ctx";align-items:center;gap:8px 10px;padding:calc(env(safe-area-inset-top) + 8px) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px}
.lg{width:40px;height:40px;border-radius:11px;display:block;box-shadow:0 4px 12px rgb(36 87 214/.3)}.lg svg{display:block}.grad{color:#ff6a13}
.bt{display:grid;line-height:1.05}.bt b{font:700 19px/1.05 "Barlow Semi Condensed",Barlow,system-ui,sans-serif}.bt small{font-size:11.5px;color:var(--mut);font-weight:600}.bt .by{font-size:10.5px;font-weight:500}

.ctx{grid-area:ctx;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ctxc{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 10px 6px 6px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.ctxc:focus-within{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent)}
.ctxc .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;box-shadow:inset 0 -2px 0 rgb(0 0 0/.15)}
.ctxc .ic svg{width:22px;height:22px}
.cv{display:grid;flex:1;line-height:1.15}.cv small{font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cv b{font-size:14.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chev{width:18px;height:18px;color:var(--mut);flex:none}
.ctxc select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
@media(min-width:760px){header.top{grid-template-columns:auto minmax(0,560px) 1fr auto;grid-template-areas:"brand ctx . lang"}}

.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}#langSeg{flex-wrap:nowrap;flex:none}#langSeg button{padding:0 9px}
.seg button{border:0;background:none;height:36px;padding:0 12px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
main{padding:14px max(14px,env(safe-area-inset-left)) 110px;max-width:1280px;width:100%;margin:0 auto}

nav.tabs::-webkit-scrollbar{display:none}nav.tabs button{flex:1 0 60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font:600 10.5px/1.1 Barlow,system-ui,sans-serif;color:var(--mut);text-align:center;cursor:pointer;border-radius:12px}
nav.tabs button .ti{width:36px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);transition:.15s}nav.tabs button .ti svg{width:21px;height:21px}nav.tabs button.on .ti{background:var(--c);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
nav.tabs button.on{color:var(--ink)}

@media(min-width:900px),(orientation:landscape) and (max-height:560px){.app{grid-template-columns:84px 1fr;grid-template-rows:auto 1fr}header.top{grid-column:1/3}nav.tabs{position:sticky;top:var(--hh,70px);grid-row:2;height:calc(100dvh - var(--hh,70px));grid-template-columns:1fr;grid-auto-rows:minmax(64px,76px);align-content:start;flex-direction:column;overflow-x:hidden;overflow-y:auto;gap:2px;border-top:0;border-right:1px solid var(--line);padding:8px 4px calc(env(safe-area-inset-bottom) + 8px) max(4px,env(safe-area-inset-left));overflow:auto}nav.tabs button{flex:0 0 auto;min-height:62px;padding:4px 0}main{grid-row:2;grid-column:2;padding-bottom:40px}}
@media(orientation:landscape) and (max-height:560px){header.top{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand ctx lang";padding-top:6px;padding-bottom:6px}.bt small{display:none}.view{height:calc(100dvh - 110px)!important;min-height:240px}.g2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}h1{font-size:24px}.sub{margin-bottom:8px}}

.sub{color:var(--mut);margin:0 0 14px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1fr)}
